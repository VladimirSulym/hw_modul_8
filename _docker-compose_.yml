services:
  web:
    build: .
    restart: unless-stopped
    command: >
      bash -c "python manage.py collectstatic --noinput && 
      python manage.py migrate && 
      python manage.py lid &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 3 --max-requests 1000"
    #              python manage.py runserver 0.0.0.0:8000"
    #              gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/var/www/html
      - static_volume:/var/www/html/staticfiles
      - media_volume:/var/www/html/media
    #    ports:
    #      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_HOST=db
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    volumes:
      - static_volume:/var/www/html/staticfiles
      - media_volume:/var/www/html/media
      - ./nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    ports:
      - "80:80"
    depends_on:
      - web
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  db:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    build: .
    volumes:
      - .:/var/www/html
      - media_volume:/var/www/html/media
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_HOST=db
    depends_on:
      - redis
      - db
      - web

  celery-beat:
    build: .
    command: celery -A config worker --beat --scheduler django --loglevel=info
    #    command: celery -A config beat —loglevel=info
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_HOST=db
    depends_on:
      - celery

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
